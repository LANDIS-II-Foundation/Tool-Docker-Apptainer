## Prebuilt support-library DLLs for the v8 UCLv2 image.
##
## These are copied into `build/extensions` BEFORE the extensions are compiled,
## because extensions reference them through HintPaths into that directory.
## That is why they are not part of `libraries-v8-release.yaml`: those entries
## are built from source with `dotnet build`, and applied AFTER the extensions.
## Installed by `scripts/install_support_libraries_v8.sh`.
##
## Pinned separately from `support-libraries-v8-release.yaml`: this image and the
## UCLv1 images have always used different commits of the same repo, and the
## mismatch described below affects only this one.

- repo: Support-Library-Dlls-v8
  org: LANDIS-II-Foundation
  ## Bumped from 69d615f0, which shipped `Landis.Library.HarvestManagement-v5.dll`
  ## and `Landis.Library.SiteHarvest-v3.dll` built against `Succession-v9` while
  ## every other extension in this image is on `Succession-v10` (see #66, #68).
  ## f0b0d68e also dropped `Landis.Extension.BiomassHarvest-v6.dll`, a UCLv1
  ## extension binary that has no business in the UCLv2 image -- Biomass Harvest
  ## is built from source here.
  ##
  ## Bumped again, from f0b0d68e, for `Landis.Library.UniversalCohorts-v2.dll`
  ## 2.0.1 (added in 04c583c1), which has the Library-Universal-Cohort#6 fix
  ## (8f6e7ed, "Corrected casting"): 1.3.0.0 reduced a cohort by
  ## `(int) fraction * biomass`, which is 0 for any fraction below 1, so partial
  ## removals (e.g. Biomass Harvest `(30%)`) removed nothing. No source build of
  ## that library is needed (cf. #73). The fix reaches the image only because the
  ## extensions step now drops the 1.3.0.0 copies that three extensions commit
  ## under `lib/` (`EXT_DROP_SHADOWING_DLLS`, see the Dockerfile), which would
  ## otherwise replace this copy. The range also adds
  ## `Landis.Library.Climate-v6.dll` and updates `Landis.Library.PnETCohorts-v2.dll`.
  ##
  ## Its `Landis.Library.PnETCohorts-v2.dll` (2.3.0.0) is replaced before the extensions are
  ## built by 2.4.2 from `libraries-v8-UCL2-release-prebuild.yaml`, which PnET-Succession
  ## 6.1.3 needs.
  ##
  ## Bumped again, from cfd7d2a3, for `Landis.Library.Succession-v10.dll` 10.1.1+9cf92634:
  ## the merged Library-Succession#26, which fixes the race in
  ## `ExtensionBase.ReproduceCohorts` that threw `InvalidOperationException: Collection
  ## was modified` with `ThreadCount > 1` (Library-Succession#25). cfd7d2a3 carried
  ## 10.0+10a5608a, which predates it. Only that one file differs between the two SLD8
  ## commits, so no other support library moves. Note that the fix removes the crash but
  ## does not make parallel runs reproducible from `RandomNumberSeed`
  ## (Library-Succession#28).
  ##
  ## Bumped again, from 351438a3, for `Landis.Library.UniversalCohorts-v2.dll` 2.0.2
  ## (Library-Universal-Cohort#7, bc5a5a3, via Support-Library-Dlls-v8#27). It makes several
  ## `Cohort` and `SiteCohorts` members `virtual` so that `Landis.Library.PnETCohorts-v2` 2.4.2
  ## can override them, which lets other extensions read PnET cohorts' age and biomass.
  ## Only that one file differs between the two SLD8 commits.
  commit: 8b2a845b5b4d04e90df20e31d3c533295622d733
