## Libraries built from source BEFORE the extensions, for the v8 UCLv2 image.
##
## Each replaces the Support-Library-Dlls-v8 copy in `build/extensions`, so the
## extensions compile against it. The later library pass (`libraries-v8-release.yaml`)
## is not enough for these: it runs after the extensions, and it is shared with the
## UCLv1 images. Order matters: later entries may reference earlier ones.
## Installed by `scripts/install_libraries_v8.sh`.

## `Landis.Library.PnETCohorts-v2` 2.4.1 (release v2.4.1, main 67d597ae). Support-Library-Dlls-v8
## 351438a3 still ships 2.3.0.0 (built from 25d18875), whose `SiteVars.UpdateUniversalCohorts()`
## gave the other extensions a fresh copy of each site's PnET cohorts every timestep: harvest and
## fire removed cohorts from the copy, and PnET's own cohorts kept them. 2.4 drops that copy, and
## PnET-Succession 6.1.2 registers PnET's own site cohorts as `Succession.UniversalCohorts` instead
## (Library-PnET-Cohort#14, Extension-PnET-Succession#31). The two must move together: 2.4 has no
## `UpdateUniversalCohorts()` for older PnET-Succession to call, and 2.3 registers the site variables
## that 6.1.2 now registers itself. 2.4.1 also fixes the rounding of above-ground biomass
## (Library-PnET-Cohort#12).
##
## Its committed `src/lib/Landis.Library.Climate-v6.dll` is identical to the
## Support-Library-Dlls-v8 copy, and its .csproj excludes `lib\**`, so it compiles against
## the `build/extensions` libraries. The v2.4.1 release DLL was built against
## Support-Library-Dlls-v8 `main` (= 351438a3), so no other library has to be rebuilt.
##
## Remove this entry once Support-Library-Dlls-v8 ships a 2.4.x build.
